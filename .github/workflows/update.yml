name: Daily Gold FX Ratio & Telegram Report

on:
  schedule:
    # اجرا روزی دوبار: 06:30 UTC و 14:30 UTC
    - cron: '25 6,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gold-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and push updated Excel file
        run: |
          git config --global user.name "Gold Tracker Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add World_Gold_Ratio_TimeSeries_Ready.xlsx
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Gold/FX tracker $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
